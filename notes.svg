<svg xmlns="http://www.w3.org/2000/svg" width="600" height="130" viewBox="0 0 600 130"><rect width="600" height="130" rx="8" fill="#FBF6F6"/><rect width="5" height="130" rx="2" fill="#D77B8A"/><text x="24" y="32" fill="#726A8D" font-family="Arial, sans-serif" font-size="16"><tspan x="24" dy="0">"Uma mente pensante controla a máquina e jamais é</tspan><tspan x="24" dy="22">controlada por ela. Após mais de cinco anos em marketing,</tspan><tspan x="24" dy="22">estou em transição para Cloud, buscando boas soluções</tspan><tspan x="24" dy="22">para problemas reais com tecnologia."</tspan></text></svg>
